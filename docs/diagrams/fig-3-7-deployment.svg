sans-serif;font-size:10px;font-weight:normal">PostgreSQL is the only system of record. Elasticsearch is a derived, rebuildable index — losing it degrades search but never loses data.</text><text x="56" y="510" text-anchor="start" fill="#1F3864" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:700">•</text><text x="68" y="510" text-anchor="start" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">Schema changes ship only as versioned, reversible migrations; deployment is gated on lint, unit, integration and coverage checks.</text><text x="40" y="576" text-anchor="start" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:12px;font-weight:600">Figure 3.7 — Deployment diagram</text><text x="40" y="596" text-anchor="start" fill="#5B6472" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:11px;font-weight:normal">Public portfolio media and private KYC documents are separated by bucket sensitivity, not merely by path.</text></svg>