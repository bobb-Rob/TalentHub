om pending, so funded money can never be discarded without an explicit financial outcome.</text><text x="112" y="458" text-anchor="start" fill="#9A5B06" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:11px;font-weight:700">•</text><text x="128" y="458" text-anchor="start" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:11px;font-weight:normal">Any transition not drawn here is rejected by the service layer.</text><text x="34" y="500" text-anchor="start" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:12px;font-weight:600">Figure 3.5 — Milestone state transition model</text><text x="34" y="520" text-anchor="start" fill="#5B6472" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:11px;font-weight:normal">Terminal states are accepted, refunded, split and cancelled.</text></svg>