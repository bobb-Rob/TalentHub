| rejected</text><line x1="790" y1="324" x2="560" y2="324" stroke="#1F3864" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="599.1" y="306.8" width="151.8" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="675.0" y="318.0" text-anchor="middle" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">7. updateKycStatus(outcome)</text><line x1="80" y1="350" x2="1110" y2="350" stroke="#D6DBE3" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="438.1" y="341.8" width="313.8" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="595" y="353.0" text-anchor="middle" fill="#5B6472" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">audience metrics, refreshed at least every 7 days (FR-12)</text><line x1="110" y1="382" x2="330" y2="382" stroke="#1F3864" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="111.69999999999999" y="364.8" width="216.60000000000002" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="220.0" y="376.0" text-anchor="middle" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">8. POST /social-accounts  (OAuth grant)</text><line x1="330" y1="414" x2="560" y2="414" stroke="#1F3864" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="358.3" y="396.8" width="173.4" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="445.0" y="408.0" text-anchor="middle" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">9. linkAccount(platform, token)</text><line x1="560" y1="446" x2="790" y2="446" stroke="#1F3864" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="566.7" y="428.8" width="216.60000000000002" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="675.0" y="440.0" text-anchor="middle" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">10. enqueue: refreshMetrics (recurring)</text><line x1="790" y1="478" x2="1010" y2="478" stroke="#1F3864" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="791.7" y="460.8" width="216.60000000000002" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="900.0" y="472.0" text-anchor="middle" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">11. GET follower count, engagement rate</text><rect x="300" y="498" width="800" height="58" rx="2" fill="none" stroke="#9B2226" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M300 498 L354 498 L354 512 L344 518 L300 518 Z" fill="#FFFFFF" stroke="#9B2226" stroke-width="1.3"/><text x="326" y="512" text-anchor="middle" fill="#9B2226" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:9.5px;font-weight:700">alt</text><text x="362" y="512" text-anchor="start" fill="#9B2226" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:9.5px;font-weight:normal">provider unavailable or rate-limited (risk R4)</text><line x1="790" y1="534" x2="560" y2="534" stroke="#9B2226" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="523.5" y="516.8" width="303.0" height="14" fill="#FFFFFF" opacity="0.94" rx="2"/><text x="675.0" y="528.0" text-anchor="middle" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:10px;font-weight:normal">12. retain figures, mark metrics_source = self_declared</text><text x="34" y="600" text-anchor="start" fill="#16213E" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:12px;font-weight:600">Figure 3.4 — Sequence diagram: creator verification and metric retrieval</text><text x="34" y="620" text-anchor="start" fill="#5B6472" style="font-family:Helvetica, Arial, 'DejaVu Sans', sans-serif;font-size:11px;font-weight:normal">Both paths are asynchronous because both depend on third parties whose latency the platform does not control. A failed metric call degrades the figure to self-declared rather than failing the profile.</text></svg>